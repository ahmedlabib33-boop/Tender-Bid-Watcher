<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Construction Opportunity Command Center</title>
<style>
:root{--bg:#09111f;--panel:#121d33;--text:#eef4ff;--muted:#9db0cf;--line:#263654;--green:#28c76f;--red:#ff5d5d;--amber:#ffc968}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#09111f,#0b1323);color:var(--text)}
.wrap{max-width:1600px;margin:auto;padding:22px}.hero{padding:24px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#172544,#10192e)}
.hero h1{margin:0;font-size:34px}.hero p{margin:7px 0 0;color:var(--muted)}
.timergrid,.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.kpis{grid-template-columns:repeat(5,1fr)}
.timer,.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.timer small,.kpi small{color:var(--muted)}.timer strong,.kpi strong{display:block;margin-top:5px;font-size:24px}
.toolbar{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}.toolbar input,.toolbar select{width:100%;padding:11px;border-radius:10px;background:#0a1325;color:var(--text);border:1px solid var(--line)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.tabbtn{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#111d35;color:var(--text);cursor:pointer}.tabbtn.active{background:#234578}.tab{display:none}.tab.active{display:block}
.card{padding:16px;border:1px solid var(--line);background:var(--panel);border-radius:16px;margin-bottom:12px}.small{color:var(--muted);font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;margin-right:5px}
.tablewrap{overflow:auto;max-height:700px;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;background:var(--panel)}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}th{position:sticky;top:0;background:#172544}
.ok{color:var(--green);font-weight:900;font-size:18px}.bad{color:var(--red);font-weight:900;font-size:18px}.btn{display:inline-block;text-decoration:none;background:#1d5da6;color:white;padding:8px 11px;border-radius:8px;margin-top:8px}.region{padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:12px;margin-bottom:10px}
@media(max-width:900px){.toolbar{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.timergrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){
 .wrap{padding:10px}.hero{padding:16px;border-radius:16px}.hero h1{font-size:24px;line-height:1.2}.hero p{font-size:13px}
 .toolbar,.kpis,.timergrid{grid-template-columns:1fr}.tabbtn{flex:1 1 calc(50% - 8px);font-size:13px;padding:9px 8px}
 .card{padding:12px}.small{font-size:12px}.badge{font-size:11px}
 table{min-width:760px}th,td{font-size:12px;padding:8px}.timer strong,.kpi strong{font-size:21px}
}

.brand-strip{
  position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:99999;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 16px;border:1px solid rgba(255,215,64,.42);border-radius:999px;
  background:linear-gradient(135deg,rgba(9,17,31,.95),rgba(19,28,49,.97));
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 0 18px rgba(255,215,64,.18),0 10px 35px rgba(0,0,0,.40);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:#dbe7ff;font-size:12px;letter-spacing:.02em;white-space:nowrap;
}
.brand-strip::before{
  content:"";width:7px;height:7px;border-radius:50%;background:#ffd84d;
  box-shadow:0 0 8px rgba(255,216,77,.95),0 0 16px rgba(255,216,77,.68);
}
.brand-name{
  color:#ffd84d;font-weight:900;
  text-shadow:0 0 6px rgba(255,216,77,.78),0 0 14px rgba(255,216,77,.50),0 0 26px rgba(255,190,0,.24);
}
.brand-sep{opacity:.45}
@media(max-width:640px){
  .brand-strip{bottom:8px;max-width:calc(100vw - 18px);padding:8px 11px;font-size:10.5px;gap:5px;overflow:hidden;text-overflow:ellipsis}
}

</style></head>
<body><div class="wrap">
<div class="hero"><h1>🏗️ Construction Opportunity Command Center</h1><p>Where • What • Who • Source path • Urgency • Reliability • Next action</p></div>

<div class="timergrid">
 <div class="timer"><small>Last checked</small><strong id="lastChecked">--</strong></div>
 <div class="timer"><small>Next check in</small><strong id="countdown">--:--:--</strong></div>
 <div class="timer"><small>Watcher cycle</small><strong>60 min</strong></div>
</div>

<div class="toolbar">
<select id="country"><option value="">All countries</option></select>
<select id="status"><option value="">All statuses</option></select>
<select id="urgency"><option value="">All urgency</option></select>
<select id="verification"><option value="">All verification</option></select>
<select id="sector"><option value="">All sectors</option></select>
<input id="search" placeholder="Search title, issuer, city, reference...">
</div>

<div class="kpis">
<div class="kpi"><small>Visible</small><strong id="kTotal">0</strong></div>
<div class="kpi"><small>Open</small><strong id="kOpen">0</strong></div>
<div class="kpi"><small>New / Updated</small><strong id="kChanged">0</strong></div>
<div class="kpi"><small>High / Critical</small><strong id="kUrgent">0</strong></div>
<div class="kpi"><small>Sites watched</small><strong id="kSites">0</strong></div>
</div>

<div class="tabs">
<button class="tabbtn active" data-tab="exec">Executive</button>
<button class="tabbtn" data-tab="queue">Action Queue</button>
<button class="tabbtn" data-tab="opps">Opportunities</button>
<button class="tabbtn" data-tab="sites">Watched Sites</button>
<button class="tabbtn" data-tab="health">Coverage Health</button>
<button class="tabbtn" data-tab="where">Where</button>
</div>

<section id="exec" class="tab active"><div id="execContent"></div></section>
<section id="queue" class="tab"><div class="tablewrap"><table id="queueTable"></table></div></section>
<section id="opps" class="tab"><div id="cards"></div></section>
<section id="sites" class="tab"><div class="tablewrap"><table id="sitesTable"></table></div></section>
<section id="health" class="tab"><div class="tablewrap"><table id="healthTable"></table></div></section>
<section id="where" class="tab"><select id="regionCountry" style="padding:10px;background:#0a1325;color:white;border:1px solid var(--line);border-radius:10px;margin-bottom:12px"></select><div id="regionCards"></div></section>
</div>

<div class="brand-strip">
  <span>Engineered &amp; Developed</span>
  <span class="brand-sep">|</span>
  <span class="brand-name">Eng. Ahmed Labib</span>
</div>

function tick(){
 const last=new Date(WATCH.last_checked), next=new Date(WATCH.next_check), now=new Date();
 $("lastChecked").textContent=isNaN(last)?"Unknown":last.toLocaleString();
 let ms=next-now;if(ms<0)ms=0;
 const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);
 $("countdown").textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function fill(id,vals){vals.forEach(v=>$(id).insertAdjacentHTML("beforeend",`<option>${v}</option>`))}

}
